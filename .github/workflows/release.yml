name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Needed for npm OIDC trusted publishing: GitHub mints a short-lived OIDC
  # token that npm exchanges for a publish credential (no NPM_TOKEN secret).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:registry
      - run: npm run build
      - run: npm test
      # Trusted publishing requires npm CLI >= 11.5.1; pin the runner's npm
      # so OIDC exchange is guaranteed regardless of the bundled version.
      - run: npm install -g npm@latest
      # Publish via npm OIDC trusted publishing: the npm CLI exchanges the
      # GitHub OIDC token for a short-lived registry token, so no NPM_TOKEN
      # secret is stored. Requires the Trusted Publisher entry under the
      # package settings on npmjs.com for this repo + the release.yml workflow.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
      # Build the offline archive (system-node variant) and attach it to the
      # GitHub Release. Platform-native prebuilds (node-pty etc.) mean each
      # platform needs its own archive — build on the target platform.
      - run: bash scripts/package-offline.sh dist-offline
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-offline/dsh-acp-gateway-*.tar.gz
          generate_release_notes: true
