name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:registry
      - run: npm run build
      - run: npm test
      # Publish to the official npm registry when NPM_TOKEN is configured
      # (automation tokens bypass 2FA). Skipped otherwise, so the GitHub
      # Release still works without npm credentials.
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Build the offline archive (system-node variant) and attach it to the
      # GitHub Release. Platform-native prebuilds (node-pty etc.) mean each
      # platform needs its own archive — build on the target platform.
      - run: bash scripts/package-offline.sh dist-offline
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-offline/dsh-acp-gateway-*.tar.gz
          generate_release_notes: true
